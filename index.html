<!DOCTYPE html>
<html lang="th">
<head>

<meta property="og:title" content="🦉 ฮูก Clear · พช.สงขลา">
<meta property="og:description" content="บริการและข้อมูลพัฒนาชุมชนจังหวัดสงขลา ในที่เดียว">
<meta name="theme-color" content="#0B2A78">

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<script>try { var t = localStorage.getItem('hk-theme'); if (t) document.documentElement.setAttribute('data-theme', t); var f = localStorage.getItem('hk-fs'); if (f) document.documentElement.setAttribute('data-fs', f); } catch (e) {}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  /*
   * HookTheme.html — ธีมกลาง "🦉ฮูก Clear" (กรมท่า-ทอง) สำหรับแดชบอร์ดคลังข้อมูลและหน้าเว็บประชาชน
   * โหมดมืด: ตามเครื่องอัตโนมัติ หรือกดปุ่มสลับ (data-theme="light" | "dark" บน <html>)
   * Adaptive: มือถือ 1 คอลัมน์ · แท็บเล็ต 2 คอลัมน์ · จอคอม ≥1024px เมนูด้านข้าง + หลายคอลัมน์ · การ์ดปรับตามความกว้างของตัวเอง (container query)
   */
  :root {
    --hk-navy: #0b2a78; --hk-navy-2: #1d4ed8; --hk-amber: #f59e0b; --hk-amber-2: #fbbf24;
    --bg: #f3f6fb; --bg-2: #e9effa; --card: #ffffff; --card-2: #f6f8fd; --text: #0f172a; --muted: #64748b; --line: #e2e8f0;
    --brand: #0b2a78; --brand-2: #1d4ed8; --ok: #059669; --warn: #d97706; --bad: #dc2626; --ai: #7c3aed;
    --male: #3b82f6; --female: #ec4899; --accent-soft: #fff7e6;
    --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 6px 18px rgba(15, 23, 42, .06);
    --shadow-lg: 0 10px 30px rgba(11, 42, 120, .14);
    --radius: 16px; --radius-sm: 10px;
    --hero: linear-gradient(135deg, #0b2a78 0%, #1d4ed8 60%, #3b82f6 100%);
    --map-lo: #dbeafe; --map-hi: #1e3a8a; --map-none: #e5e7eb; --map-ink-hi: #fff; --map-halo-hi: rgba(15,23,42,.7); --map-ink-lo: #0f172a; --map-halo-lo: rgba(255,255,255,.8); --deep-word: "สีเข้ม";
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1220; --bg-2: #0f1a2e; --card: #111c31; --card-2: #16233d; --text: #e5edf9; --muted: #94a3b8; --line: #23324f;
      --brand: #93c5fd; --brand-2: #60a5fa; --accent-soft: #2a2110;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35); --shadow-lg: 0 10px 30px rgba(0, 0, 0, .5);
      --hero: linear-gradient(135deg, #0b1f5c 0%, #1e3a8a 60%, #1d4ed8 100%);
      --map-lo: #1e293b; --map-hi: #60a5fa; --map-none: #334155; --map-ink-hi: #0b1220; --map-halo-hi: rgba(255,255,255,.55); --map-ink-lo: #e2e8f0; --map-halo-lo: rgba(2,6,23,.75); --deep-word: "สีสว่าง";
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1220; --bg-2: #0f1a2e; --card: #111c31; --card-2: #16233d; --text: #e5edf9; --muted: #94a3b8; --line: #23324f;
    --brand: #93c5fd; --brand-2: #60a5fa; --accent-soft: #2a2110;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35); --shadow-lg: 0 10px 30px rgba(0, 0, 0, .5);
    --hero: linear-gradient(135deg, #0b1f5c 0%, #1e3a8a 60%, #1d4ed8 100%);
    --map-lo: #1e293b; --map-hi: #60a5fa; --map-none: #334155; --map-ink-hi: #0b1220; --map-halo-hi: rgba(255,255,255,.55); --map-ink-lo: #e2e8f0; --map-halo-lo: rgba(2,6,23,.75); --deep-word: "สีสว่าง";
    color-scheme: dark;
  }

  html, body { background: var(--bg) !important; color: var(--text); }
  body { font-family: 'Sarabun', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  h1, h2, h3, .k, .brand { font-family: 'Kanit', 'Sarabun', sans-serif; }
  a { color: var(--brand-2); }
  .tnum, b, .val { font-variant-numeric: tabular-nums; }

  /* ปุ่มสลับโหมด */
  .theme-btn { border: 1px solid rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .12); color: #fff; width: 38px; height: 38px;
    border-radius: 12px; cursor: pointer; font-size: 18px; display: inline-grid; place-items: center; }
  .theme-btn:hover { background: rgba(255, 255, 255, .22); }

  /* ======================= แดชบอร์ดเจ้าหน้าที่ (body.hk-app) ======================= */
  .hk-app header.top { background: var(--hero); padding: 12px 18px; box-shadow: var(--shadow-lg); gap: 12px; }
  .hk-app header.top .brand { font-size: 19px; letter-spacing: .2px; }
  .hk-app header.top .right { display: flex; align-items: center; gap: 10px; }
  .hk-app main { max-width: 1480px; padding: 16px 18px 104px; }

  .hk-app .card, .hk-app .table-wrap { background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: var(--radius); }
  .hk-app .card .sub, .hk-app .hint, .hk-app .foot { color: var(--muted); }
  .hk-app select, .hk-app input[type=text], .hk-app input[type=search], .hk-app input[type=number], .hk-app input[type=date], .hk-app input:not([type]), .hk-app textarea {
    background: var(--card); color: var(--text); border-color: var(--line); border-radius: 12px; }
  .hk-app button.ghost, .hk-app .chip, .hk-app button.icon { background: var(--card); color: var(--text); border-color: var(--line); }
  .hk-app button.primary { background: var(--hk-navy); border-radius: 12px; box-shadow: 0 4px 12px rgba(11, 42, 120, .25); }
  :root[data-theme="dark"] .hk-app button.primary { background: #1d4ed8; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hk-app button.primary { background: #1d4ed8; } }
  .hk-app .seg { background: var(--bg-2); border: 1px solid var(--line); }
  .hk-app .seg button.on { background: var(--card); color: var(--brand); }
  .hk-app .notice { background: var(--accent-soft); border-color: rgba(245, 158, 11, .35); color: var(--warn); }
  .hk-app .notice.ai { background: rgba(124, 58, 237, .08); border-color: rgba(124, 58, 237, .3); color: var(--ai); }
  .hk-app table.data th { background: var(--card-2); color: var(--muted); }
  .hk-app table.data td, .hk-app table.data th { border-color: var(--line); }
  .hk-app table.data tr:hover td { background: var(--card-2); }
  .hk-app #busy { background: rgba(2, 6, 23, .45); }

  /* ตัวเลขเด่น (hero tiles) */
  .hk-app .tiles.hl { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 6px 0 14px; }
  .hk-app .tiles.hl .tile { position: relative; overflow: hidden; border: 1px solid var(--line); border-top: 0; background: var(--card); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 14px 16px; cursor: pointer; transition: transform .15s, box-shadow .15s; }
  .hk-app .tiles.hl .tile::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 4px; background: linear-gradient(90deg, var(--hk-amber), var(--hk-navy-2)); }
  .hk-app .tiles.hl .tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .hk-app .tiles.hl .tile b { font-family: 'Kanit', sans-serif; font-weight: 600; font-size: 26px; color: var(--brand); display: block; }
  .hk-app .tiles.hl .tile span { color: var(--muted); font-size: 13px; }
  .hk-app .tiles.hl .tile .ic { font-size: 22px; opacity: .9; }
  .hk-app .tiles .tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }

  /* กลุ่ม + การ์ด */
  .hk-app .group-title { font-family: 'Kanit', sans-serif; font-weight: 600; font-size: 18px; color: var(--text); margin: 26px 0 10px; }
  .hk-app .group-title::after { background: var(--line); }
  .hk-app .svc-title { font-family: 'Kanit', sans-serif; font-weight: 500; color: var(--brand); font-size: 16px; margin: 14px 0 8px; }
  .hk-app .mod-grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 14px; }
  .hk-app .mod-card { transition: transform .15s, box-shadow .15s; }
  .hk-app .mod-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .hk-app .kv { border-color: var(--line); }
  .hk-app .bar-track { background: var(--bg-2); border-radius: 999px; }
  .hk-app .bar-fill { background: linear-gradient(90deg, var(--hk-navy-2), #60a5fa); border-radius: 999px; }
  .hk-app .bar-fill.warn { background: linear-gradient(90deg, #f97316, var(--hk-amber-2)); }
  .hk-app .fd-box { background: var(--card-2); border-color: var(--line); border-radius: var(--radius); }
  .hk-app .fd-sum { background: var(--card); border: 1px solid var(--line); }
  .hk-app .fd-bar { border-left-color: var(--hk-amber); }
  .hk-app .badge { background: rgba(29, 78, 216, .1); color: var(--brand); }

  /* แดชบอร์ด จปฐ. (ปรับตามความกว้างของการ์ด) */
  .hk-app .fd-card { container-type: inline-size; }
  .hk-app .jpt-kpis > div { background: var(--card-2); border: 1px solid var(--line); border-radius: 14px; }
  .hk-app .jpt-kpis b { color: var(--brand); font-family: 'Kanit', sans-serif; font-weight: 600; font-size: 24px; }
  .jpt-grid { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 12px; }
  .jpt-panel { background: var(--card-2); border: 1px solid var(--line); border-radius: 14px; padding: 12px; min-width: 0; }
  .jpt-panel h4 { margin: 0 0 8px; font-family: 'Kanit', sans-serif; font-weight: 500; font-size: 15px; color: var(--text); }
  .jpt-panel .chart-box { position: relative; }
  @container (min-width: 760px) {
    .jpt-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); }
    .jpt-grid.even { grid-template-columns: 1fr 1fr; }
  }
  .hk-app .jpt-cat { background: var(--card); border: 1px solid var(--line); }
  .hk-app .jpt-cat.ok { background: rgba(5, 150, 105, .08); }
  .hk-app .jpt-note { background: var(--accent-soft); color: var(--text); }
  .hk-app .jpt-table table th, .hk-app .jpt-table table td { border-color: var(--line); }
  .hk-app .jpt-table tr.bad td { background: rgba(249, 115, 22, .08); }

  /* เมนู: มือถือ/แท็บเล็ต = ด้านล่าง · จอคอม = ด้านซ้าย */
  .hk-app nav.bottom { background: var(--card); border-top-color: var(--line); box-shadow: 0 -4px 16px rgba(15, 23, 42, .06); }
  .hk-app nav.bottom button { color: var(--muted); }
  .hk-app nav.bottom button.on { color: var(--brand); }
  .hk-app nav.bottom button.add b { background: var(--hk-navy); box-shadow: 0 6px 14px rgba(11, 42, 120, .35); }
  .hk-app nav.bottom .nav-brand { display: none; }
  @media (min-width: 640px) {
    .hk-app .filters { grid-template-columns: repeat(auto-fit, minmax(200px, 260px)); }
  }
  @media (min-width: 1024px) {
    .hk-app nav.bottom { top: 0; bottom: 0; right: auto; width: 228px; grid-auto-flow: row; grid-auto-rows: max-content; align-content: start; gap: 4px;
      padding: 76px 12px 16px; border-top: 0; border-right: 1px solid var(--line); box-shadow: none; z-index: 15; }
    .hk-app nav.bottom button { display: flex; align-items: center; gap: 12px; text-align: left; padding: 10px 14px; border-radius: 12px; font-size: 15px; }
    .hk-app nav.bottom button b { display: inline; font-size: 18px; }
    .hk-app nav.bottom button span { font-size: 15px; }
    .hk-app nav.bottom button:hover { background: var(--bg-2); }
    .hk-app nav.bottom button.on { background: rgba(29, 78, 216, .1); }
    .hk-app nav.bottom button.add b { width: auto; height: auto; margin: 0; background: none; color: var(--brand); box-shadow: none; }
    .hk-app nav.bottom .nav-brand { display: block; position: absolute; left: 0; right: 0; bottom: 16px; padding: 0 18px; font-size: 12px; color: var(--muted); }
    .hk-app header.top { z-index: 20; }
    .hk-app main { margin-left: 228px; padding: 20px 28px 40px; }
    .hk-app .mod-grid { grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }
  }
  @media (min-width: 1600px) { .hk-app main { max-width: none; } }
  .tablewrap { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
  .mod-grid > *, .jpt-grid > *, .card { min-width: 0; }
  table.heat td, table.heat th { padding: 6px 7px; font-size: 12px; white-space: nowrap; }
  .hk-prog { height: 12px; border-radius: 999px; background: var(--line); overflow: hidden; margin: 12px 0 2px; }
  .hk-prog i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--hk-amber), var(--brand)); }
  /* แผนที่ 16 อำเภอ */
  .hk-map { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .hk-map-svg { width: 100%; max-width: 340px; max-height: 540px; height: auto; display: block; }
  .hk-map-svg path { stroke: var(--card); stroke-width: 1.1; stroke-linejoin: round; cursor: pointer; transition: opacity .15s; }
  .hk-map-svg path:hover, .hk-map-svg path.on { stroke: var(--hk-amber); stroke-width: 2.4; }
  .hk-map-lbl.t-hi { fill: var(--map-ink-hi); stroke: var(--map-halo-hi); }
  .hk-map-lbl.t-lo { fill: var(--map-ink-lo); stroke: var(--map-halo-lo); }
  .hk-map-lbl.t-none { fill: var(--muted); stroke: var(--card); }
  .hk-deep::after { content: var(--deep-word); }
  .stat-map { margin-top: 8px; }
  .stat-map summary { cursor: pointer; color: var(--brand); font-size: 13px; }
  .stat-map .hk-map { margin-top: 8px; }
  .hk-map-lbl { font: 600 10.5px 'Sarabun', sans-serif; text-anchor: middle; dominant-baseline: middle; pointer-events: none; paint-order: stroke; stroke-width: 2.6px; stroke-linejoin: round; }
  .hk-lake { font: italic 9px 'Sarabun', sans-serif; fill: var(--muted); text-anchor: middle; pointer-events: none; }
  .hk-map-legend { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); width: 100%; max-width: 300px; }
  .hk-map-legend i { flex: 1; height: 10px; border-radius: 999px; border: 1px solid var(--line); }
  .hk-map-info { font-size: 13px; color: var(--muted); text-align: center; min-height: 20px; }
  .hk-map-info b { color: var(--text); }
</style>

<style>
  /* ออกแบบให้ผู้สูงอายุและวัยรุ่นใช้ร่วมกัน: ปุ่มใหญ่ ตัวอักษรใหญ่ ข้อความสั้น รายละเอียดพับเก็บ ปรับขนาดตัวอักษรได้ 3 ระดับ */
  * { box-sizing: border-box; }
  html { font-size: 17px; scroll-behavior: smooth; }
  html[data-fs="1"] { font-size: 19px; }
  html[data-fs="2"] { font-size: 21px; }
  body { margin: 0; line-height: 1.6; padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
  button, .btn, .tile, summary { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 3px solid var(--hk-amber); outline-offset: 2px; }

  /* ส่วนหัว */
  header.hero { background: var(--hero); color: #fff; padding: 16px 16px 18px; position: relative; overflow: hidden; }
  header.hero::after { content: '🦉'; position: absolute; right: -12px; bottom: -36px; font-size: 140px; opacity: .08; }
  .wrap { max-width: 1100px; margin: 0 auto; position: relative; z-index: 1; }
  .hero-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  header.hero h1 { margin: 0; font-size: 1.6rem; font-weight: 600; line-height: 1.2; }
  header.hero p { margin: 2px 0 0; opacity: .9; font-size: .9rem; }
  .tools { display: flex; gap: 6px; flex-shrink: 0; }
  .tools button { min-width: 46px; height: 46px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, .35); background: rgba(255, 255, 255, .14);
    color: #fff; font-family: 'Kanit', sans-serif; font-size: 1rem; cursor: pointer; padding: 0 8px; }
  .tools .theme-btn { width: 46px; border-radius: 14px; }
  .hero-kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
  .hero-kpis > div { background: rgba(255, 255, 255, .13); border: 1px solid rgba(255, 255, 255, .22); border-radius: 14px; padding: 8px 10px; text-align: center; }
  .hero-kpis b { display: block; font-family: 'Kanit', sans-serif; font-size: 1.25rem; font-weight: 600; line-height: 1.3; }
  .hero-kpis span { font-size: .78rem; opacity: .9; }

  main { max-width: 1100px; margin: 0 auto; padding: 14px 16px 24px; }
  .view { display: none; }
  .view.on { display: block; animation: fadein .18s ease; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* หน้าแรก: ปุ่มใหญ่ */
  .camp { background: color-mix(in srgb, #F59E0B 15%, var(--card)); border: 1px solid color-mix(in srgb, #F59E0B 45%, var(--line)); border-radius: 18px;
    padding: 12px 16px; margin-bottom: 14px; }
  .camp b { font-family: 'Kanit', sans-serif; font-weight: 500; font-size: 1.02rem; }
  .camp .hk-prog { margin: 8px 0 2px; }
  .camp small { color: var(--muted); font-size: .85rem; }
  .home-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 640px) { .home-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (min-width: 960px) { .home-grid { gap: 16px; } .tile { min-height: 150px; } }
  .tile { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 128px; padding: 14px 10px;
    background: var(--card); border: 1px solid var(--line); border-top: 5px solid var(--c, var(--brand)); border-radius: 20px; box-shadow: var(--shadow);
    color: var(--text); cursor: pointer; font: inherit; text-align: center; transition: transform .12s, box-shadow .12s; }
  .tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .tile:active { transform: scale(.97); }
  .tile .ic { font-size: 2.5rem; line-height: 1.1; }
  .tile b { font-family: 'Kanit', sans-serif; font-size: 1.08rem; font-weight: 500; line-height: 1.3; }
  .tile small { font-size: .82rem; color: var(--muted); line-height: 1.3; }
  .quick { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 10px; margin-top: 14px; }

  /* ปุ่ม */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 10px 18px; border-radius: 16px; border: 0;
    background: var(--hk-navy); color: #fff; font-family: 'Kanit', sans-serif; font-size: 1rem; text-decoration: none; cursor: pointer; text-align: center; line-height: 1.3; }
  .btn.alt { background: var(--bg-2); color: var(--text); border: 1px solid var(--line); }
  .btn.green { background: #06C755; }
  .btn.amber { background: #D97706; }
  .btns { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 8px; margin-top: 12px; }

  /* หน้าย่อย */
  .back { display: inline-flex; align-items: center; gap: 6px; min-height: 48px; padding: 6px 16px 6px 10px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); color: var(--text); font-family: 'Kanit', sans-serif; font-size: 1rem; cursor: pointer; margin-bottom: 10px; }
  .view h2 { font-size: 1.45rem; font-weight: 600; margin: 4px 0 2px; color: var(--text); }
  .view .sub { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }
  .lead { font-size: 1rem; margin: 0; }
  .meta { color: var(--muted); font-size: .85rem; }
  .empty { color: var(--muted); background: var(--card); border-radius: 16px; border: 1px dashed var(--line); padding: 18px; text-align: center; }

  /* รายการพับได้ (หัวข้อเป็นปุ่มใหญ่) */
  .acc { background: var(--card); border: 1px solid var(--line); border-left: 6px solid var(--c, var(--brand)); border-radius: 16px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .acc > summary { list-style: none; display: flex; align-items: center; gap: 10px; min-height: 60px; padding: 10px 14px; cursor: pointer;
    font-family: 'Kanit', sans-serif; font-size: 1.05rem; font-weight: 500; color: var(--text); line-height: 1.35; }
  .acc > summary::-webkit-details-marker { display: none; }
  .acc > summary::after { content: '›'; margin-left: auto; font-size: 1.6rem; color: var(--muted); transition: transform .15s; }
  .acc[open] > summary::after { transform: rotate(90deg); }
  .acc > summary .e { font-size: 1.5rem; }
  .acc .in { padding: 0 16px 16px; }
  .more { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 6px; }
  .more > summary { cursor: pointer; font-family: 'Kanit', sans-serif; color: var(--brand); min-height: 44px; display: flex; align-items: center; font-size: .98rem; }
  .more p { white-space: pre-line; margin: 4px 0 0; font-size: .95rem; }

  /* บริการ: ปุ่มหมวด */
  .grp-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  @media (min-width: 760px) { .grp-grid { grid-template-columns: repeat(3, 1fr); } }
  .grp-grid .tile { min-height: 96px; }
  .grp-grid .tile.on { background: color-mix(in srgb, var(--c) 14%, var(--card)); box-shadow: inset 0 0 0 2px var(--c); }
  .stat { margin-top: 10px; }
  .card { background: var(--card); border-radius: 18px; padding: 14px 16px; box-shadow: var(--shadow); border: 1px solid var(--line); min-width: 0; }
  .card.wide { grid-column: 1 / -1; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; }
  .card h3 { margin: 4px 0 4px; font-size: 1.08rem; font-weight: 500; color: var(--brand); }
  .card img { width: 100%; border-radius: 12px; margin-bottom: 8px; aspect-ratio: 20/13; object-fit: cover; }
  .clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin: 4px 0 0; }

  /* อำเภอ */
  .dist-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 10px; }
  .dist-grid .card h3 { font-size: 1.15rem; }

  /* ตาราง/กราฟ (HookCharts) */
  .tablewrap { overflow-x: auto; border-radius: 14px; border: 1px solid var(--line); background: var(--card); }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { background: var(--card-2); font-family: 'Kanit', sans-serif; font-weight: 500; color: var(--brand); }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .jpt-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(125px, 1fr)); gap: 10px; margin-top: 8px; }
  .jpt-kpis > div { background: var(--card-2); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; }
  .jpt-kpis b { display: block; font-family: 'Kanit', sans-serif; font-size: 1.3rem; font-weight: 600; color: var(--brand); }
  .jpt-kpis b small { font-size: .85rem; color: var(--muted); }
  .jpt-kpis span { font-size: .8rem; color: var(--muted); }
  .jpt-note { margin-top: 10px; font-size: .9rem; background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; }
  .jpt-table { margin-top: 12px; }
  .jpt-table table { font-size: .82rem; }
  .jpt-table tr.bad td { background: rgba(249, 115, 22, .08); }
  .jpt-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .jpt-tabs button { font-family: 'Kanit', sans-serif; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px;
    min-height: 46px; padding: 6px 16px; cursor: pointer; font-size: .95rem; }
  .jpt-tabs button.on { background: var(--hk-navy); color: #fff; border-color: transparent; }
  .jpt-tabs .jpt-tg { font-size: .8rem; color: var(--muted); width: 100%; font-weight: 600; margin-top: 4px; }
  table.heat td, table.heat th { padding: 6px 7px; font-size: .75rem; white-space: nowrap; }

  /* แถบปุ่มด้านล่าง (ใช้นิ้วโป้งกดได้ทุกวัย) */
  nav.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: color-mix(in srgb, var(--card) 94%, transparent); backdrop-filter: blur(10px);
    border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  nav.bar .wrap { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; max-width: 640px; }
  nav.bar button, nav.bar a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; min-height: 62px; border-radius: 14px;
    border: 0; background: transparent; color: var(--text); font-family: 'Kanit', sans-serif; font-size: .82rem; text-decoration: none; cursor: pointer; }
  nav.bar .i { font-size: 1.55rem; line-height: 1.2; }
  nav.bar .on { background: color-mix(in srgb, var(--brand) 14%, transparent); color: var(--brand); }
  nav.bar .line { color: #06C755; }
  footer { max-width: 1100px; margin: 0 auto; padding: 4px 16px 20px; color: var(--muted); font-size: .8rem; text-align: center; }
  @media (min-width: 1024px) { header.hero { padding: 22px 24px 24px; } header.hero h1 { font-size: 1.9rem; } main { padding: 20px 24px 30px; } }
</style>

<script>
/**
 * HookCharts.html — กราฟและโหมดมืดที่ใช้ร่วมกัน (แดชบอร์ดคลังข้อมูล + หน้าเว็บประชาชน)
 * ต้องโหลด Chart.js ก่อน · HK.slot() คืน HTML ที่มี canvas แล้ว HK.mount() สร้างกราฟหลังใส่ HTML ลงหน้า
 */
var HK = (function () {
  var pending = {};
  var live = [];
  var seq = 0;
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var n0 = function (v) { return Number(v || 0).toLocaleString('th-TH'); };
  var pct = function (v) { return (Math.abs(v) < 10 ? Number(v).toFixed(2) : Number(v).toFixed(1)) + '%'; };
  function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

  function isDark() {
    var t = document.documentElement.getAttribute('data-theme');
    if (t) return t === 'dark';
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }

  function defaults() {
    if (!window.Chart) return;
    Chart.defaults.font.family = "'Sarabun', system-ui, sans-serif";
    Chart.defaults.font.size = 12;
    Chart.defaults.color = cssVar('--muted') || '#64748b';
    Chart.defaults.borderColor = cssVar('--line') || '#e2e8f0';
    Chart.defaults.plugins.legend.labels.boxWidth = 12;
    Chart.defaults.plugins.tooltip.padding = 10;
    Chart.defaults.maintainAspectRatio = false;
  }

  /** ช่องกราฟ: cfg = ฟังก์ชันคืน config ของ Chart.js (เรียกตอน mount เพื่อให้ได้สีของธีมปัจจุบัน) */
  function slot(cfg, height) {
    var id = 'hkc' + (++seq);
    pending[id] = cfg;
    return '<div class="chart-box" style="height:' + (height || 260) + 'px"><canvas id="' + id + '" role="img"></canvas></div>';
  }

  function mount() {
    if (!window.Chart) return;
    defaults();
    Object.keys(pending).forEach(function (id) {
      var el = document.getElementById(id);
      if (el) live.push(new Chart(el, pending[id]()));
    });
    pending = {};
  }

  function destroyAll() {
    live.forEach(function (c) { try { c.destroy(); } catch (e) { /* ไม่เป็นไร */ } });
    live = [];
  }

  /** ปุ่มสลับโหมด: เก็บค่าในเครื่อง (ถ้าใช้ได้) แล้วเรียก onChange ให้วาดกราฟใหม่ด้วยสีใหม่ */
  function themeButton(btn, onChange) {
    if (!btn) return;
    var paint = function () { btn.textContent = isDark() ? '☀️' : '🌙'; };
    paint();
    btn.addEventListener('click', function () {
      var next = isDark() ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('hk-theme', next); } catch (e) { /* โหมดส่วนตัว */ }
      paint();
      if (onChange) onChange();
    });
    if (window.matchMedia) {
      try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { paint(); if (onChange) onChange(); }); } catch (e) { /* เบราว์เซอร์เก่า */ }
    }
  }

  var C = function () {
    return {
      navy: isDark() ? '#60a5fa' : '#1d4ed8', amber: '#f59e0b', orange: '#f97316', green: '#10b981',
      male: '#3b82f6', female: '#ec4899', grid: cssVar('--line'), soft: isDark() ? 'rgba(96,165,250,.25)' : 'rgba(29,78,216,.15)',
    };
  };

  function kpis(items) {
    return '<div class="jpt-kpis">' + items.filter(Boolean).map(function (k) { return '<div><b>' + k[0] + '</b><span>' + k[1] + '</span></div>'; }).join('') + '</div>';
  }

  /* ---------- สรุปผล จปฐ. 38 ตัวชี้วัด ---------- */
  function jptSummary(d, opt) {
    opt = opt || {};
    var ind = d.indicators || [];
    var failing = ind.filter(function (x) { return x.fail > 0; }).sort(function (a, b) { return b.failPct - a.failPct; });
    var allPass = ind.length - failing.length;

    var html = kpis([

      [allPass + '<small>/' + ind.length + '</small>', 'ตัวชี้วัดผ่านเกณฑ์ทุกราย'],
      failing.length ? [pct(failing[0].failPct), 'ไม่ผ่านสูงสุด · ข้อ ' + failing[0].no] : null,

      + slot(function () {
        var c = C();
        return {
          type: 'bar',
          data: {
            labels: cats.map(function (x) { return x.name.length > 14 ? x.name.slice(0, 14) + '…' : x.name; }),

              { label: 'ผ่านทุกราย', data: cats.map(function (x) { return x.n - x.problems; }), backgroundColor: c.green, borderRadius: 6, stack: 's' },
              { label: 'ยังมีผู้ไม่ผ่าน', data: cats.map(function (x) { return x.problems; }), backgroundColor: c.orange, borderRadius: 6, stack: 's' },

            plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { afterBody: function (it) { var k = cats[it[0].dataIndex]; return 'ข้อ ' + k.from + '–' + k.to + ' · ผ่านต่ำสุด ' + (k.minPass == null ? '-' : pct(k.minPass)); } } } },
          },
        };

      + (failing.length ? slot(function () {

        return {
          type: 'bar',
          data: { labels: top.map(function (x) { return 'ข้อ ' + x.no + ' ' + (x.name.length > 26 ? x.name.slice(0, 26) + '…' : x.name); }),
            datasets: [{ label: 'ร้อยละไม่ผ่าน', data: top.map(function (x) { return x.failPct; }), backgroundColor: top.map(function (x, i) { return i < 3 ? c.orange : c.amber; }), borderRadius: 6 }] },
          options: {
            indexAxis: 'y', scales: { x: { ticks: { callback: function (v) { return v + '%'; } } }, y: { grid: { display: false }, ticks: { autoSkip: false } } },
            plugins: { legend: { display: false }, tooltip: { callbacks: {
              title: function (it) { var x = top[it[0].dataIndex]; return 'ข้อ ' + x.no + ' ' + x.name; },
              label: function (it) { var x = top[it.dataIndex]; return 'ไม่ผ่าน ' + pct(x.failPct) + ' (' + n0(x.fail) + ' ' + unitTxt(x) + ')'; },
            } } },
          },
        };
      }, 320) : '<div class="sub">ผ่านเกณฑ์ทุกตัวชี้วัด 🎉</div>') + '</div></div>';
    if (opt.table !== false) {
      html += '<details class="jpt-table"><summary>ดูตาราง 38 ตัวชี้วัด</summary><div class="tablewrap"><table><thead><tr><th>ข้อ</th><th>ตัวชี้วัด</th><th class="n">สำรวจ</th><th class="n">ผ่าน %</th><th class="n">ไม่ผ่าน</th></tr></thead><tbody>'

  /* ---------- ระดับความสุขรายพื้นที่ ---------- */
  function jptHappy(d) {
    var list = (d.areas || []).slice().sort(function (a, b) { return b.value - a.value; });
    var html = kpis([
      [Number(d.avg).toFixed(2), 'ระดับความสุขเฉลี่ย (เต็ม 10)'],
      [esc(list[0].area), 'สูงสุด ' + list[0].value.toFixed(2)],
      [esc(list[list.length - 1].area), 'ต่ำสุด ' + list[list.length - 1].value.toFixed(2)],
      [list.filter(function (x) { return x.value < d.avg; }).length, 'พื้นที่ต่ำกว่าค่าเฉลี่ย'],
    ]);
    var lo = Math.min.apply(null, list.map(function (x) { return x.value; }));
    var mp = map(list.map(function (x) { return { area: x.area, value: x.value }; }), { label: 'ความสุข', fmt: function (v) { return Number(v).toFixed(2); } });
    html += '<div class="jpt-grid">' + (mp ? panel('แผนที่ระดับความสุข <small class="sub">(' + deep() + ' = สุขมาก)</small>', mp) : '');
    html += '<div class="jpt-panel"><h4>ระดับความสุขรายพื้นที่ <small class="sub">(สีส้ม = ต่ำกว่าค่าเฉลี่ย ' + Number(d.avg).toFixed(2) + ')</small></h4>' + slot(function () {
      var c = C();
      return {
        type: 'bar',
        data: { labels: list.map(function (x) { return x.area; }), datasets: [{ label: 'ระดับความสุข', data: list.map(function (x) { return x.value; }),

        options: { indexAxis: 'y', scales: { x: { min: Math.floor((lo - 0.3) * 10) / 10, max: 10 }, y: { grid: { display: false }, ticks: { autoSkip: false } } },
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: function (it) { return 'ความสุข ' + Number(it.raw).toFixed(2) + ' / 10'; } } } } },
      };
    }, Math.max(240, list.length * 24)) + '</div></div>';

  }

  /* ---------- แผนที่ 16 อำเภอ (choropleth) — รูปร่างจาก HookMap.html ---------- */
  var mapSeq = 0;
  var deep = function () { return '<span class="hk-deep"></span>'; }; // คำว่า สีเข้ม/สีสว่าง เปลี่ยนตามธีมด้วย CSS
  var mapData = {};
  /**
   * rows = [{district|area, value}] · opt = { label, unit, fmt(v), note }
   * สีเข้ม = ค่ามาก (สีเดียวไล่ระดับ) · แตะ/ชี้อำเภอเพื่อดูตัวเลข · อำเภอที่ไม่มีข้อมูลเป็นสีเทา
   */
  function map(rows, opt) {
    if (!window.HK_MAP) return '';
    opt = opt || {};
    var fmt = opt.fmt || function (v) { return n0(v); };
    var val = {};
    rows.forEach(function (r) { var k = String(r.district || r.area || '').replace(/^(อำเภอ|อ\.)\s*/, ''); if (HK_MAP.districts[k] && r.value != null) val[k] = Number(r.value); });
    var keys = Object.keys(val);
    if (keys.length < 3) return '';
    var vs = keys.map(function (k) { return val[k]; });
    var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
    // สีตามธีมผ่านตัวแปร CSS (--map-lo → --map-hi) — สลับโหมดสว่าง/มืดแล้วเปลี่ยนสีทันทีโดยไม่ต้องวาดใหม่
    var tOf = function (v) { return hi > lo ? (v - lo) / (hi - lo) : 0.5; };
    var col = function (v) { return 'color-mix(in srgb, var(--map-hi) ' + Math.round((0.12 + tOf(v) * 0.88) * 100) + '%, var(--map-lo))'; };
    // ตัวอักษร + ขอบตัวอักษรตัดกับสีพื้น (อ่านออกแม้ชื่อล้นไปทับอำเภอข้างเคียง)
    var ink = function (v) { return tOf(v) > 0.55 ? 't-hi' : 't-lo'; };
    var id = 'hkm' + (++mapSeq);
    var sorted = keys.slice().sort(function (a, b) { return val[b] - val[a]; });
    mapData[id] = { val: val, fmt: fmt, label: opt.label || '', unit: opt.unit || '', rank: sorted };
    var D = HK_MAP.districts;
    var svg = '<svg viewBox="-4 -4 ' + (HK_MAP.w + 8) + ' ' + (HK_MAP.h + 8) + '" class="hk-map-svg" role="img" aria-label="แผนที่จังหวัดสงขลา ' + esc(opt.label || '') + ' รายอำเภอ">'
      + '<text x="64" y="206" class="hk-lake">ทะเลสาบ</text><text x="64" y="217" class="hk-lake">สงขลา</text>'
      + Object.keys(D).map(function (k) {
        var has = val[k] != null;
        return '<path d="' + D[k].d + '" data-d="' + esc(k) + '" style="fill:' + (has ? col(val[k]) : 'var(--map-none)') + '"><title>' + esc(k) + (has ? ': ' + esc(fmt(val[k])) : ': ไม่มีข้อมูล') + '</title></path>';
      }).join('')
      + Object.keys(D).map(function (k) {
        var has = val[k] != null;
        return '<text x="' + D[k].x + '" y="' + D[k].y + '" class="hk-map-lbl ' + (has ? ink(val[k]) : 't-none') + '">' + esc(k) + '</text>';
      }).join('')
      + '</svg>';
    var legend = '<div class="hk-map-legend"><span>' + esc(fmt(lo)) + '</span><i style="background:linear-gradient(90deg,' + col(lo) + ',' + col(hi) + ')"></i><span>' + esc(fmt(hi)) + '</span></div>';
    return '<div class="hk-map" id="' + id + '">' + svg + legend
      + '<div class="hk-map-info" aria-live="polite">' + (opt.note ? esc(opt.note) + ' · ' : '') + 'แตะอำเภอบนแผนที่เพื่อดูตัวเลข</div></div>';
  }

  // แตะ/ชี้อำเภอ → แสดงชื่อ ค่า และอันดับ (ตัวจัดการเดียวทั้งหน้า ไม่ต้องผูกใหม่ทุกครั้งที่วาด)
  function mapPick(e) {
    var p = e.target.closest && e.target.closest('.hk-map path[data-d]');
    if (!p) return;
    var box = p.closest('.hk-map');
    var m = mapData[box.id];
    if (!m) return;
    var k = p.getAttribute('data-d');
    Array.prototype.forEach.call(box.querySelectorAll('path.on'), function (x) { x.classList.remove('on'); });
    p.classList.add('on');
    p.parentNode.insertBefore(p, p.parentNode.querySelector('.hk-map-lbl')); // ยกขึ้นเหนืออำเภออื่น (แต่อยู่ใต้ชื่ออำเภอ) ให้เส้นขอบเห็นครบ
    var info = box.querySelector('.hk-map-info');
    info.innerHTML = m.val[k] == null ? '<b>อ.' + esc(k) + '</b> · ไม่มีข้อมูล'
      : '<b>อ.' + esc(k) + '</b> · ' + esc(m.label) + ' <b>' + esc(m.fmt(m.val[k])) + '</b> · อันดับ ' + (m.rank.indexOf(k) + 1) + ' จาก ' + m.rank.length;
  }
  if (typeof document !== 'undefined') {
    document.addEventListener('click', mapPick);
    document.addEventListener('mouseover', function (e) { if (window.matchMedia && window.matchMedia('(hover: hover)').matches) mapPick(e); });
  }

  /* ---------- ส่วนประกอบที่ใช้ซ้ำ ---------- */
  var PALETTE = function () { var c = C(); return [c.navy, c.amber, c.green, c.orange, '#8b5cf6', '#06b6d4', '#94a3b8', '#e11d48']; };
  var short = function (s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n) + '…' : s; };
  function panel(title, inner, wide) { return '<div class="jpt-panel"' + (wide ? ' style="grid-column:1/-1"' : '') + '><h4>' + title + '</h4>' + inner + '</div>'; }
  function grid(a, b) { return '<div class="jpt-grid">' + a + (b || '') + '</div>'; }

  /** โดนัท: items = [{label, value}] */
  function donut(items, unit, height) {
    return slot(function () {
      var tot = items.reduce(function (s, x) { return s + x.value; }, 0);
      return { type: 'doughnut', data: { labels: items.map(function (x) { return x.label; }), datasets: [{ data: items.map(function (x) { return x.value; }), backgroundColor: PALETTE(), borderWidth: 0 }] },
        options: { cutout: '60%', plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { label: function (it) { return it.label + ': ' + n0(it.raw) + ' ' + unit + ' (' + pct(tot ? it.raw / tot * 100 : 0) + ')'; } } } } } };
    }, height || 260);
  }

  /** แท่งแนวนอนเรียงค่า + เน้นสีที่อยู่ฝั่ง "ควรติดตาม" ของค่าเฉลี่ย (flag: 'below' | 'above' | null) */
  function hbar(list, label, fmt, avg, flag, minX) {
    return slot(function () {
      var c = C();
      var bad = function (v) { return avg != null && (flag === 'below' ? v < avg : flag === 'above' ? v > avg : false); };
      return {
        type: 'bar',
        data: { labels: list.map(function (x) { return x.label; }), datasets: [{ label: label, data: list.map(function (x) { return x.value; }),
          backgroundColor: list.map(function (x) { return bad(x.value) ? c.orange : c.navy; }), borderRadius: 6 }] },
        options: { indexAxis: 'y', scales: { x: { min: minX, ticks: { callback: function (v) { return fmt(v); } } }, y: { grid: { display: false }, ticks: { autoSkip: false } } },
          plugins: { legend: { display: false }, tooltip: { callbacks: { label: function (it) { return label + ': ' + fmt(it.raw); } } } } },
      };
    }, Math.max(220, list.length * 24));
  }

  /** แท่งแนวนอน ชาย/หญิง ซ้อนกัน */
  function genderBar(groups, height) {
    return slot(function () {
      var c = C();
      return {
        type: 'bar',
        data: { labels: groups.map(function (g) { return short(g.label, 22); }), datasets: [
          { label: 'ชาย', data: groups.map(function (g) { return g.male; }), backgroundColor: c.male, borderRadius: 4, stack: 's' },
          { label: 'หญิง', data: groups.map(function (g) { return g.female; }), backgroundColor: c.female, borderRadius: 4, stack: 's' },
        ] },
        options: { indexAxis: 'y', scales: { x: { stacked: true, ticks: { callback: function (v) { return n0(v); } } }, y: { stacked: true, grid: { display: false }, ticks: { autoSkip: false } } },
          plugins: { legend: { position: 'bottom' }, tooltip: { callbacks: { title: function (it) { return groups[it[0].dataIndex].label; }, label: function (it) { return it.dataset.label + ': ' + n0(it.raw) + ' คน'; } } } } },
      };
    }, height || Math.max(240, groups.length * 26));
  }

  function table(head, rows) {
    return '<details class="jpt-table"><summary>ดูตารางตัวเลข</summary><div class="tablewrap"><table><thead><tr>' + head.map(function (h, i) { return '<th' + (i ? ' class="n"' : '') + '>' + h + '</th>'; }).join('')
      + '</tr></thead><tbody>' + rows.map(function (r) { return '<tr>' + r.map(function (c, i) { return '<td' + (i ? ' class="n"' : '') + '>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div></details>';
  }

  var popOf = function (d) { return d.population ? function (v) { return pct(v / d.population * 100); } : function () { return '-'; }; };

  /* ---------- รายได้ / รายจ่ายเฉลี่ยของครัวเรือน ---------- */
  function jptMoney(d) {
    var inc = d.kind === 'jpt_income';
    var areas = (d.areas || []).slice().sort(function (a, b) { return b.avgHh - a.avgHh; });
    var html = kpis([
      [n0(Math.round(d.avgHh)) + '<small> บาท</small>', d.word + 'เฉลี่ยต่อครัวเรือน/ปี'],
      d.avgPerson ? [n0(Math.round(d.avgPerson)) + '<small> บาท</small>', d.word + 'เฉลี่ยต่อคน/ปี'] : null,
      [n0(Math.round(d.avgHh / 12)) + '<small> บาท</small>', 'เฉลี่ยต่อครัวเรือน/เดือน'],
      [n0(d.households), 'ครัวเรือน'],
    ]);
    var mp = map(areas.map(function (a) { return { area: a.area, value: a.avgHh }; }), { label: d.word + '/ครัวเรือน/ปี', fmt: function (v) { return n0(Math.round(v)) + ' บาท'; } });
    html += grid(
      mp ? panel('แผนที่' + d.word + 'เฉลี่ยต่อครัวเรือน <small class="sub">(' + deep() + ' = ' + d.word + 'สูง)</small>', mp) : '',
      panel(d.word + 'เฉลี่ยต่อครัวเรือนรายพื้นที่ <small class="sub">(สีส้ม = ' + (inc ? 'ต่ำกว่า' : 'สูงกว่า') + 'ค่าเฉลี่ย ' + n0(Math.round(d.avgHh)) + ')</small>',
        hbar(areas.map(function (a) { return { label: a.area, value: a.avgHh }; }), d.word + 'เฉลี่ย/ครัวเรือน', function (v) { return n0(Math.round(v)); }, d.avgHh, inc ? 'below' : 'above')));
    html += grid(panel('ที่มาของ' + d.word + ' (ทั้งพื้นที่)', donut((d.sources || []).map(function (s) { return { label: s.label, value: s.value }; }), 'บาท', 280), true));
    html += table(['พื้นที่', 'ครัวเรือน', 'คน', d.word + '/ครัวเรือน', d.word + '/คน'], areas.map(function (a) {
      return [esc(a.area), n0(a.households), n0(a.population), n0(Math.round(a.avgHh)), a.avgPerson != null ? n0(Math.round(a.avgPerson)) : '-'];
    }));
    return html;
  }

  /* ---------- อาชีพ / ศาสนา ---------- */
  function jptOcc(d) {
    var groups = (d.groups || []).slice().sort(function (a, b) { return b.total - a.total; });
    var p = popOf(d);
    var work = groups.filter(function (g) { return !/กำลังศึกษา|ไม่มีอาชีพ|พิการ|ยังไม่ถึงวัย/.test(g.label); });
    var html = kpis([
      [n0(d.population), 'ประชากร'],
      work[0] ? [esc(work[0].label), 'อาชีพหลัก · ' + p(work[0].total)] : null,
      d.agri != null ? [p(d.agri), 'ภาคเกษตร (' + n0(d.agri) + ' คน)'] : null,
      d.none != null ? [n0(d.none), 'ไม่มีอาชีพ (คน)'] : null,
    ]);
    html += grid(panel('ประชากรตามประเภทอาชีพ (ชาย/หญิง)', genderBar(groups), true));
    html += table(['อาชีพ', 'ชาย', 'หญิง', 'รวม', 'ร้อยละ'], groups.map(function (g) { return [esc(g.label), n0(g.male), n0(g.female), n0(g.total), p(g.total)]; }));
    return html;
  }

  function jptRelig(d) {
    var groups = (d.groups || []).slice().sort(function (a, b) { return b.total - a.total; });
    var p = popOf(d);
    var html = kpis(groups.slice(0, 4).map(function (g) { return [p(g.total), 'ศาสนา' + esc(g.label) + ' (' + n0(g.total) + ' คน)']; }));
    html += grid(panel('สัดส่วนประชากรตามศาสนา', donut(groups.map(function (g) { return { label: g.label, value: g.total }; }), 'คน', 260)),
      panel('ชาย/หญิง ตามศาสนา', genderBar(groups, 260)));
    return html;
  }

  /* ---------- อาชีพ × ช่วงอายุ (ตารางความร้อน) ---------- */
  function jptOccAge(d) {
    var rows = (d.rows || []).slice().sort(function (a, b) { return b.total - a.total; });
    var max = 0;
    rows.forEach(function (r) { r.values.forEach(function (v) { if (v > max) max = v; }); });
    var html = kpis([
      [n0(d.oldWork), 'ผู้สูงอายุ 60+ ที่ยังประกอบอาชีพ' + (d.old ? ' (' + pct(d.oldWork / d.old * 100) + ')' : '')],
      [n0(d.joblessWork), 'วัย 15–59 ปี ที่ไม่มีอาชีพ'],
      [n0(d.kidsWork), 'เด็กต่ำกว่า 15 ปีที่ประกอบอาชีพ'],
      [n0(d.population), 'ประชากรในตาราง'],
    ]);
    var cell = function (v) {
      var a = max ? Math.sqrt(v / max) : 0;
      return '<td class="n" style="background:rgba(29,78,216,' + (a * 0.55).toFixed(3) + ');' + (a > 0.75 ? 'color:#fff' : '') + '">' + (v ? n0(v) : '·') + '</td>';
    };
    html += '<div class="jpt-panel" style="margin-top:12px"><h4>จำนวนคน: ประเภทอาชีพ × ช่วงอายุ <small class="sub">(' + deep() + ' = คนมาก)</small></h4><div class="tablewrap"><table class="heat"><thead><tr><th>อาชีพ</th>'
      + (d.ages || []).map(function (a) { return '<th class="n">' + esc(a) + '</th>'; }).join('') + '<th class="n">รวม</th></tr></thead><tbody>'
      + rows.map(function (r) { return '<tr><td>' + esc(r.label) + '</td>' + r.values.map(cell).join('') + '<td class="n"><b>' + n0(r.total) + '</b></td></tr>'; }).join('')
      + '</tbody></table></div></div>';
    return html;
  }

  /* ---------- ตารางรายพื้นที่: ประชากร / คนต่อครัวเรือน / เขตการปกครอง ---------- */
  function jptArea(d) {
    var t = d.total || {};
    var areas = (d.areas || []).slice();
    if (d.kind === 'jpt_zone') {
      var html = kpis(areas.slice().sort(function (a, b) { return b.population - a.population; }).map(function (a) {
        return [pct(t.population ? a.population / t.population * 100 : 0), esc(a.area) + ' (' + n0(a.population) + ' คน)'];
      }));
      return html + grid(panel('ประชากรตามเขตการปกครอง', donut(areas.map(function (a) { return { label: a.area, value: a.population }; }), 'คน', 260)),
        panel('ครัวเรือนตามเขตการปกครอง', donut(areas.map(function (a) { return { label: a.area, value: a.households }; }), 'ครัวเรือน', 260)));
    }
    if (d.kind === 'jpt_hhsize') {
      var s = areas.slice().sort(function (a, b) { return b.perHh - a.perHh; });
      return kpis([[Number(t.perHh).toFixed(2), 'คนต่อครัวเรือน (เฉลี่ย)'], [esc(s[0].area), 'ครัวเรือนใหญ่สุด ' + s[0].perHh.toFixed(2) + ' คน'],
        [esc(s[s.length - 1].area), 'ครัวเรือนเล็กสุด ' + s[s.length - 1].perHh.toFixed(2) + ' คน'], [n0(t.households), 'ครัวเรือน']])
        + grid(panel('แผนที่คนต่อครัวเรือน <small class="sub">(' + deep() + ' = ครัวเรือนใหญ่)</small>', map(s.map(function (a) { return { area: a.area, value: a.perHh }; }), { label: 'คนต่อครัวเรือน', fmt: function (v) { return Number(v).toFixed(2) + ' คน'; } })),
          panel('จำนวนคนต่อครัวเรือนรายพื้นที่ <small class="sub">(สีส้ม = ต่ำกว่าค่าเฉลี่ย — ครัวเรือนเล็ก/อยู่ลำพังมากกว่า)</small>',
            hbar(s.map(function (a) { return { label: a.area, value: a.perHh }; }), 'คน/ครัวเรือน', function (v) { return Number(v).toFixed(2); }, t.perHh, 'below', Math.max(0, Math.floor(s[s.length - 1].perHh * 10 - 3) / 10))));
    }
    var byPop = areas.slice().sort(function (a, b) { return b.population - a.population; });
    return kpis([[n0(t.population), 'ประชากร (ชาย ' + n0(t.male) + ' · หญิง ' + n0(t.female) + ')'], [n0(t.households), 'ครัวเรือน'],
      [esc(byPop[0].area), 'ประชากรมากสุด ' + n0(byPop[0].population)], [areas.length, 'พื้นที่']])
      + grid(panel('แผนที่ประชากรรายอำเภอ <small class="sub">(' + deep() + ' = คนมาก)</small>', map(byPop.map(function (a) { return { area: a.area, value: a.population }; }), { label: 'ประชากร', fmt: function (v) { return n0(v) + ' คน'; } })),
        panel('ประชากรรายพื้นที่ (ชาย/หญิง)', genderBar(byPop.map(function (a) { return { label: a.area, male: a.male || 0, female: a.female || 0 }; }))))
      + table(['พื้นที่', 'ครัวเรือน', 'ชาย', 'หญิง', 'รวม', 'คน/ครัวเรือน'], byPop.map(function (a) { return [esc(a.area), n0(a.households), n0(a.male), n0(a.female), n0(a.population), a.perHh != null ? a.perHh.toFixed(2) : '-']; }));
  }

  /* ---------- ที่พักอาศัย ---------- */
  function jptHousing(d) {
    var cats = d.categories || [];
    var own = d.own >= 0 ? cats[d.own] : null;
    var rest = cats.filter(function (c, i) { return i !== d.own; }).sort(function (a, b) { return b.value - a.value; });
    var notOwn = function (a) { return own && a.households ? (a.households - a.values[d.own]) / a.households * 100 : 0; };
    var areas = (d.areas || []).slice().sort(function (a, b) { return notOwn(b) - notOwn(a); });
    var avgNot = own ? 100 - own.pct : null;
    var html = kpis([own ? [pct(own.pct), 'อยู่บนที่ดินของตนเอง'] : null].concat(rest.slice(0, 3).map(function (c) { return [n0(c.value), esc(c.label) + ' (ครัวเรือน)']; })));
    if (own) {
      html += grid(panel('แผนที่ครัวเรือนที่ไม่ได้อยู่บนที่ดินตนเอง <small class="sub">(' + deep() + ' = สัดส่วนสูง)</small>',
        map(areas.map(function (a) { return { area: a.area, value: Math.round(notOwn(a) * 100) / 100 }; }), { label: 'ไม่ได้อยู่บนที่ดินตนเอง', fmt: function (v) { return pct(v); } })),
      panel('ร้อยละที่ไม่ได้อยู่บนที่ดินตนเอง รายพื้นที่ <small class="sub">(สีส้ม = สูงกว่าค่าเฉลี่ย ' + pct(avgNot) + ')</small>',
        hbar(areas.map(function (a) { return { label: a.area, value: Math.round(notOwn(a) * 100) / 100 }; }), 'ไม่ได้อยู่บนที่ดินตนเอง', function (v) { return v + '%'; }, avgNot, 'above')));
    }
    html += grid(panel('ครัวเรือนที่ไม่ได้อยู่บนที่ดินของตนเอง แยกประเภท', hbar(rest.map(function (c) { return { label: c.label, value: c.value }; }), 'ครัวเรือน', n0, null, null), true));
    html += table(['พื้นที่', 'ครัวเรือน'].concat(cats.map(function (c) { return esc(c.label); })), areas.map(function (a) { return [esc(a.area), n0(a.households)].concat(a.values.map(n0)); }));
    return html;
  }

  /* ---------- เปรียบเทียบระหว่างปี ---------- */
  function jptCompare(d) {
    var y = d.years || [];
    var last = y.length - 1;
    var ch = (d.indicators || []).filter(function (x) { return x.pcts[0] != null && x.pcts[last] != null; })
      .map(function (x) { return { no: x.no, name: x.name, diff: x.pcts[last] - x.pcts[0], pcts: x.pcts }; });
    var down = ch.filter(function (x) { return x.diff < 0; }).sort(function (a, b) { return a.diff - b.diff; });
    var up = ch.filter(function (x) { return x.diff > 0; });
    var html = kpis([[up.length, 'ตัวชี้วัดดีขึ้น'], [down.length, 'ตัวชี้วัดแย่ลง'], [ch.length - up.length - down.length, 'เท่าเดิม'], [y[0] + '→' + y[last], 'ปีที่เปรียบเทียบ']]);
    var top = ch.slice().sort(function (a, b) { return Math.abs(b.diff) - Math.abs(a.diff); }).slice(0, 12);
    html += '<div class="jpt-panel" style="margin-top:12px"><h4>ร้อยละผ่านเกณฑ์ที่เปลี่ยนไปมากที่สุด (จุด) <small class="sub">(สีส้ม = แย่ลง)</small></h4>' + (top.length ? slot(function () {
      var c = C();
      return { type: 'bar', data: { labels: top.map(function (x) { return 'ข้อ ' + x.no + ' ' + short(x.name, 24); }), datasets: [{ label: 'เปลี่ยนแปลง', data: top.map(function (x) { return x.diff; }),
        backgroundColor: top.map(function (x) { return x.diff < 0 ? c.orange : c.green; }), borderRadius: 6 }] },
        options: { indexAxis: 'y', scales: { y: { grid: { display: false }, ticks: { autoSkip: false } } }, plugins: { legend: { display: false }, tooltip: { callbacks: {
          title: function (it) { var x = top[it[0].dataIndex]; return 'ข้อ ' + x.no + ' ' + x.name; },
          label: function (it) { var x = top[it.dataIndex]; return x.pcts.map(function (v, i) { return y[i] + ': ' + (v == null ? '-' : pct(v)); }).join(' · ') + ' (' + (x.diff > 0 ? '+' : '') + x.diff.toFixed(2) + ' จุด)'; } } } } } };
    }, Math.max(240, top.length * 26)) : '<div class="sub">ไม่มีการเปลี่ยนแปลง</div>') + '</div>';
    return html;
  }

  // ชนิดรายงาน → ชื่อแท็บสั้น + หมวด (ใช้ทั้งหน้าเว็บประชาชนและแดชบอร์ดเจ้าหน้าที่)
  var KINDS = {
    jpt_summary: ['สรุป 38 ตัวชี้วัด', 'ภาพรวม'], jpt_fail: ['ตัวชี้วัดตกเกณฑ์', 'ภาพรวม'], jpt_compare: ['เทียบรายปี', 'ภาพรวม'], jpt_happy: ['ความสุข', 'ภาพรวม'],
    jpt_income: ['รายได้', 'เศรษฐกิจ'], jpt_expense: ['รายจ่าย', 'เศรษฐกิจ'], jpt_occ: ['อาชีพ', 'เศรษฐกิจ'], jpt_occage: ['อาชีพ×อายุ', 'เศรษฐกิจ'],
    jpt_age: ['ช่วงอายุ', 'ประชากร'], jpt_age_intl: ['อายุ 5 ปี (สากล)', 'ประชากร'], jpt_age_kcc: ['อายุแบบ กชช.2ค', 'ประชากร'], jpt_areapop: ['ประชากรรายอำเภอ', 'ประชากร'],
    jpt_hhsize: ['คนต่อครัวเรือน', 'ประชากร'], jpt_zone: ['เขตการปกครอง', 'ประชากร'], jpt_relig: ['ศาสนา', 'ประชากร'], jpt_housing: ['ที่พักอาศัย', 'ที่อยู่อาศัย'],
  };
  function jptTab(kind) { return (KINDS[kind] || [kind, 'อื่น ๆ'])[0]; }
  function jptGroup(kind) { return (KINDS[kind] || [kind, 'อื่น ๆ'])[1]; }

  /* ---------- ตัวจัดรูปแบบตัวเลขตามหน่วย ---------- */
  function fmtBy(unit, money) {
    if (money || /บาท/.test(unit || '')) return function (v) { v = Number(v) || 0; return Math.abs(v) >= 1e6 ? (v / 1e6).toLocaleString('th-TH', { maximumFractionDigits: 2 }) + ' ล้านบาท' : n0(Math.round(v)) + ' บาท'; };
    if (/%|ร้อยละ/.test(unit || '')) return function (v) { return pct(Number(v) || 0); };
    return function (v) { v = Number(v) || 0; return (v % 1 ? v.toLocaleString('th-TH', { maximumFractionDigits: 2 }) : n0(v)) + (unit ? ' ' + unit : ''); };
  }
  var isDistrictList = function (rows) {
    if (!window.HK_MAP) return false;
    var hit = rows.filter(function (r) { return HK_MAP.districts[String(r.district || r.key || r.area || '').replace(/^(อำเภอ|อ\.)\s*/, '')]; }).length;
    return hit >= 3 && hit >= rows.length * 0.6;
  };

  /**
   * กราฟเปรียบเทียบรายพื้นที่แบบเดียวกับ จปฐ.: แผนที่ + แท่งแนวนอน (สีส้ม = ต่ำกว่าค่าเฉลี่ย)
   * rows = [{key|district, value}] · opt = { label, unit, money, flag: 'below'|'above'|null }
   */
  function distBlock(rows, opt) {
    opt = opt || {};
    var fmt = fmtBy(opt.unit, opt.money);
    var list = rows.map(function (r) { return { label: String(r.key || r.district || r.area || ''), value: Number(r.value) || 0 }; })
      .filter(function (r) { return r.label; }).sort(function (a, b) { return b.value - a.value; });
    if (!list.length) return '';
    var avg = list.reduce(function (s, x) { return s + x.value; }, 0) / list.length;
    var flag = opt.flag === undefined ? 'below' : opt.flag;
    var bar = panel(esc(opt.label || '') + ' <small class="sub">' + (flag ? '(สีส้ม = ' + (flag === 'below' ? 'ต่ำกว่า' : 'สูงกว่า') + 'ค่าเฉลี่ย ' + esc(fmt(avg)) + ')' : '') + '</small>',
      hbar(list, opt.label || 'ค่า', fmt, flag ? avg : null, flag));
    var mp = isDistrictList(rows) ? map(list.map(function (x) { return { district: x.label, value: x.value }; }), { label: opt.label, fmt: fmt }) : '';
    return mp ? grid(panel('แผนที่' + esc(opt.label || '') + ' <small class="sub">(' + deep() + ' = ค่ามาก)</small>', mp), bar) : grid(bar.replace('class="jpt-panel"', 'class="jpt-panel" style="grid-column:1/-1"'));
  }

  /**
   * แท็บข้อมูล (โมดูล) ของคลังข้อมูล: การ์ดตัวเลข + กราฟรายพื้นที่ — หน้าตาเดียวกับ จปฐ.
   * m = { tiles: [{label, text}], chart: { label, unit, money, data: [{key, value}] } }
   */
  function moduleBlock(m) {
    var tiles = (m.tiles || []).filter(function (t) { return t.text && t.text !== '-'; }).slice(0, 4);
    var html = kpis(tiles.map(function (t) { return [esc(t.text), esc(t.label)]; }));
    if (m.chart && m.chart.data && m.chart.data.length > 1) {
      html += distBlock(m.chart.data, { label: m.chart.label, unit: m.chart.unit, money: m.chart.money, flag: m.chart.flag === undefined ? 'below' : m.chart.flag });
    }
    return html;
  }

  /* ---------- ความคืบหน้าการจัดเก็บ จปฐ. (เชื่อมจากระบบความคืบหน้า) ---------- */
  function progressBlock(d) {
    var t = d.total || {};
    var list = (d.districts || []).slice().sort(function (a, b) { return b.pct - a.pct; });
    var html = kpis([
      [pct(t.pct || 0), 'จัดเก็บสุทธิแล้ว (ทั้งจังหวัด)'],
      [n0(t.net) + '<small>/' + n0(t.target) + '</small>', 'ครัวเรือน (สุทธิ/เป้าหมาย)'],
      [n0(Math.max(0, t.target - t.net)), 'ครัวเรือนที่ยังต้องจัดเก็บ'],
      [n0((t.dup || 0) + (t.pending || 0)), 'ซ้ำ ' + n0(t.dup) + ' · รอตรวจสอบ ' + n0(t.pending)],
    ]);
    html += '<div class="hk-prog" role="img" aria-label="ความคืบหน้า ' + pct(t.pct || 0) + '"><i style="width:' + Math.min(100, t.pct || 0) + '%"></i></div>';
    if (list.length) {
      html += distBlock(list.map(function (x) { return { district: x.district, value: Math.round(x.pct * 100) / 100 }; }), { label: 'ร้อยละจัดเก็บสุทธิ', unit: '%', flag: 'below' });
    }
    var h = (d.history || []).filter(function (x) { return x.date; });
    if (h.length > 1) {
      html += grid(panel('แนวโน้มความคืบหน้ารายวัน (ร้อยละทั้งจังหวัด)', slot(function () {
        var c = C();
        return { type: 'line', data: { labels: h.map(function (x) { var p = x.date.split('-'); return Number(p[2]) + '/' + Number(p[1]); }),
          datasets: [{ label: 'ร้อยละสุทธิ', data: h.map(function (x) { return x.pct; }), borderColor: c.navy, backgroundColor: c.soft, fill: true, tension: 0.25, pointRadius: 3 }] },
          options: { scales: { y: { beginAtZero: true, ticks: { callback: function (v) { return v + '%'; } } }, x: { grid: { display: false } } },
            plugins: { legend: { display: false }, tooltip: { callbacks: { label: function (it) { var x = h[it.dataIndex]; return pct(x.pct) + ' · สุทธิ ' + n0(x.net) + ' ครัวเรือน'; } } } } } };
      }, 240), true));
    }
    html += table(['อำเภอ', 'เป้าหมาย', 'ผลจัดเก็บ', 'ซ้ำ', 'รอตรวจสอบ', 'สุทธิ', 'ร้อยละ'], list.map(function (x) {
      return [esc(x.district), n0(x.target), n0(x.collected), n0(x.dup), n0(x.pending), n0(x.net), pct(x.pct)];
    }));
    if (d.synced) html += '<div class="sub" style="margin-top:8px">🔗 ซิงก์จากระบบความคืบหน้า จปฐ. ล่าสุด ' + esc(d.synced.at) + ' น. (ข้อมูลต้นทาง ณ ' + esc(d.synced.source) + ') · ดึงใหม่อัตโนมัติทุกชั่วโมง</div>';
    return html;
  }

  /** ทำลายเฉพาะกราฟที่อยู่ในกล่องนี้ (ไม่กระทบกราฟหน้าอื่น) */
  function destroyIn(el) {
    live = live.filter(function (c) {
      if (el && c.canvas && el.contains(c.canvas)) { try { c.destroy(); } catch (e) { /* ไม่เป็นไร */ } return false; }
      return true;
    });
  }

  function jptBlock(detail, opt) {
    if (!detail) return '';
    var k = detail.kind;
    if (k === 'jpt_progress') return progressBlock(detail);
    if (k === 'jpt_summary' || k === 'jpt_fail') return jptSummary(detail, opt);
    if (k === 'jpt_age' || k === 'jpt_age_intl' || k === 'jpt_age_kcc') return jptAge(detail);
    if (k === 'jpt_happy') return jptHappy(detail);
    if (k === 'jpt_income' || k === 'jpt_expense') return jptMoney(detail);
    if (k === 'jpt_occ') return jptOcc(detail);
    if (k === 'jpt_relig') return jptRelig(detail);
    if (k === 'jpt_occage') return jptOccAge(detail);
    if (k === 'jpt_areapop' || k === 'jpt_hhsize' || k === 'jpt_zone') return jptArea(detail);
    if (k === 'jpt_housing') return jptHousing(detail);
    if (k === 'jpt_compare') return jptCompare(detail);
    return '';
  }

  return {
    slot: slot, mount: mount, destroyAll: destroyAll, destroyIn: destroyIn, themeButton: themeButton, isDark: isDark, cssVar: cssVar,
    jptBlock: jptBlock, jptTab: jptTab, jptGroup: jptGroup, map: map, defaults: defaults,
    moduleBlock: moduleBlock, progressBlock: progressBlock, distBlock: distBlock, fmtBy: fmtBy,
    ui: { kpis: kpis, panel: panel, grid: grid, hbar: hbar, donut: donut, table: table },
  };
})();
</script>

<script>
function main(D) { // D = ข้อมูลสาธารณะ (ฝังจาก Apps Script หรือโหลดจาก ?api=public เมื่อเปิดบน GitHub Pages)
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function n0(v) { return Number(v || 0).toLocaleString('th-TH'); }
  function baht(n) { n = Number(n) || 0; return n >= 1e6 ? (Math.round(n / 1e4) / 100).toLocaleString('th-TH') + ' ล้านบาท' : Math.round(n).toLocaleString('th-TH') + ' บาท'; }
  function $(s) { return document.querySelector(s); }
  var TEL = D.tel || '074311674';

  /* ---------- ข้อความสั้น: ย่อหน้าแรกเป็นข้อความนำ ที่เหลือพับไว้ใน "อ่านรายละเอียด" ---------- */
  function split(body) {
    var parts = String(body || '').split(/\n\s*\n/);
    var lead = parts.shift() || '';
    var rest = parts.join('\n\n');
    if (lead.length > 170) { rest = String(body); lead = lead.slice(0, 150).replace(/\s+\S*$/, '') + '…'; }
    return { lead: lead, rest: rest };
  }
  function linkBtn(url, label, cls) {
    if (!url) return '';
    return '<a class="btn' + (cls ? ' ' + cls : '') + '" href="' + esc(url) + '">' + label + '</a>';
  }
  function goBtn(view, label, cls) { return '<button type="button" class="btn' + (cls ? ' ' + cls : '') + '" data-go="' + view + '">' + label + '</button>'; }
  function statBlock(x) {
    if (!(x.stats && x.stats.length)) return '';
    return '<details class="more"><summary>📊 ดูตัวเลขจังหวัดสงขลา</summary>' + x.stats.map(function (m) {
      var mp = m.map ? HK.map(m.map.rows, { label: m.map.label, fmt: HK.fmtBy(m.map.unit, m.map.money) }) : '';
      return '<div class="stat"><div class="meta">' + esc(m.name) + ' · ปีงบ ' + esc(m.fy) + '</div>'
        + HK.ui.kpis(m.tiles.map(function (t) { return [esc(t.text), esc(t.label)]; })) + mp + '</div>';
    }).join('') + '</details>';
  }
  /** รายการพับได้: หัวข้อเป็นปุ่มใหญ่ → ข้อความนำ + ปุ่ม + รายละเอียดพับไว้ */
  function acc(x, opt) {
    opt = opt || {};
    var t = split(x.body);
    var btns = '';
    if (x.url) btns += linkBtn(x.url, /^tel:/.test(x.url) ? '📞 โทร' : '🔗 ' + esc(x.urlLabel || 'ดูข้อมูล'));
    if (x.url2) btns += linkBtn(x.url2, '🔗 ' + esc(x.url2Label || 'ข้อมูลเพิ่มเติม'), 'alt');
    if (opt.contact) btns += goBtn('districts', '📍 ติดต่อ พช.อำเภอ', 'alt');
    return '<details class="acc"' + (opt.color ? ' style="--c:' + esc(opt.color) + '"' : '') + (opt.open ? ' open' : '') + '><summary>'
      + (opt.emoji ? '<span class="e">' + opt.emoji + '</span>' : '') + esc(x.title) + '</summary><div class="in">'
      + (x.image ? '<img src="' + esc(x.image) + '" alt="" style="width:100%;border-radius:12px;margin-bottom:8px">' : '')
      + '<p class="lead">' + esc(t.lead) + '</p>' + (btns ? '<div class="btns">' + btns + '</div>' : '')
      + statBlock(x)
      + (t.rest ? '<details class="more"><summary>📖 อ่านรายละเอียด</summary><p>' + esc(t.rest) + '</p></details>' : '')
      + '</div></details>';
  }
  function view(id, title, sub, inner) {
    return '<section class="view" id="v-' + id + '"><button type="button" class="back" data-go="home">◀ หน้าแรก</button>'
      + '<h2>' + title + '</h2>' + (sub ? '<p class="sub">' + sub + '</p>' : '') + inner + '</section>';
  }

  /* ---------- ตัวเลขเด่น 3 ตัว (จาก จปฐ. ที่เผยแพร่แล้ว) ---------- */
  var J = D.jpt || [];
  function jd(kind) { return (J.find(function (x) { return x.detail.kind === kind; }) || {}).detail; }
  var jSum = jd('jpt_summary'), jAge = jd('jpt_age'), jHap = jd('jpt_happy'), jInc = jd('jpt_income');
  var hero = [];
  if (jAge || jSum) hero.push([n0((jAge || jSum).households), 'ครัวเรือน']);
  if (jHap || (jSum && jSum.happiness != null)) hero.push([Number(jHap ? jHap.avg : jSum.happiness).toFixed(1) + '<small style="font-size:.7em;opacity:.8">/10</small>', 'ความสุข']);
  if (jInc) hero.push([(Math.round(jInc.avgHh / 1000)).toLocaleString('th-TH') + '<small style="font-size:.7em;opacity:.8">พัน</small>', 'รายได้เฉลี่ย/ปี']);
  else if (jAge) hero.push([n0(jAge.population), 'ประชากร']);
  if (hero.length < 3) hero.push([n0(D.districts.length), 'อำเภอ']);
  $('#hero-kpis').innerHTML = hero.slice(0, 3).map(function (k) { return '<div><b>' + k[0] + '</b><span>' + k[1] + '</span></div>'; }).join('');

  /* ---------- หน้าแรก ---------- */
  var K = D.knnTours || [];
  var P = D.projects;
  var groups = (D.svcGroups || []).filter(function (g) { return D.services.some(function (s) { return s.group === g.key; }); });
  var TILES = [
    ['services', '🧭', 'บริการ พช.', D.services.length + ' เรื่อง', '#2563EB'],
    J.length ? ['jpt', '📊', 'ข้อมูล จปฐ.', 'กราฟ · แผนที่', '#0891B2'] : null,
    ['projects', '🔍', 'เคลียร์โครงการ', 'งบประมาณ', '#7C3AED'],
    K.length ? ['knn', '🌾', 'เที่ยวโคก หนอง นา', K.length + ' อำเภอ', '#16A34A'] : null,
    ['districts', '📍', 'ติดต่ออำเภอ', D.districts.length + ' อำเภอ', '#E11D48'],
    ['help', '💬', 'ถาม / ร้องเรียน', 'คำถามพบบ่อย', '#D97706'],
    ['activities', '📸', 'กิจกรรม', 'ภาพกิจกรรม', '#DB2777'],
    ['about', '🦉', 'เกี่ยวกับเรา', 'ที่ตั้ง · ติดต่อ', '#0B2A78'],
    ['integrity', '✨', 'พช.ใสสะอาด', 'ความโปร่งใส', '#0F766E'],
  ].filter(Boolean);

  var html = '<section class="view" id="v-home">';
  var C = D.jptCampaign;
  if (C) {
    html += '<div class="camp" role="note"><b>📣 อาสาสมัครกำลังเก็บข้อมูล จปฐ. ปี 2570</b><div>โปรดให้ข้อมูลตามจริง ข้อมูลเป็นความลับ</div>'
      + (C.pct != null ? '<div class="hk-prog" role="img" aria-label="ความคืบหน้า ' + esc(C.pct) + '%"><i style="width:' + Math.min(100, Number(C.pct) || 0) + '%"></i></div>'
        + '<small>ทั้งจังหวัดเก็บแล้ว ' + esc(C.pct) + '%</small>' : '')
      + '</div>';
  }
  html += '<div class="home-grid">' + TILES.map(function (t) {
    return '<button type="button" class="tile" data-go="' + t[0] + '" style="--c:' + t[4] + '"><span class="ic" aria-hidden="true">' + t[1] + '</span><b>' + t[2] + '</b><small>' + esc(t[3]) + '</small></button>';
  }).join('') + '</div>';
  html += '<div class="quick">' + linkBtn('tel:' + TEL, '📞 โทรสำนักงาน 074-311674')
    + (D.lineUrl ? linkBtn(D.lineUrl, '💚 คุยกับฮูกใน LINE', 'green') : '') + goBtn('districts', '📍 ติดต่ออำเภอใกล้บ้าน', 'alt') + '</div>';
  html += '</section>';

  /* ---------- บริการ: เลือกหมวด (ปุ่มใหญ่) → รายการพับได้ ---------- */
  html += view('services', '🧭 บริการ พช.', 'แตะหมวด แล้วแตะเรื่องที่สนใจ',
    '<div class="grp-grid">' + groups.map(function (g) {
      return '<button type="button" class="tile" data-grp="' + esc(g.key) + '" style="--c:' + esc(g.color) + '"><span class="ic" style="font-size:2rem" aria-hidden="true">' + g.emoji + '</span><b>' + esc(g.name) + '</b></button>';
    }).join('') + '</div><div id="svc-list"></div>');

  /* ---------- จปฐ. ---------- */
  if (J.length) {
    var jGroups = [];
    J.forEach(function (x, i) {
      var g = HK.jptGroup(x.detail.kind);
      var row = jGroups.find(function (r) { return r.name === g; });
      if (!row) jGroups.push(row = { name: g, items: [] });
      row.items.push('<button type="button" data-i="' + i + '"' + (i === 0 ? ' class="on"' : '') + '>' + esc(HK.jptTab(x.detail.kind)) + '</button>');
    });
    var fyJ = J.map(function (x) { return Number(x.fy) || 0; }).reduce(function (a, b) { return Math.max(a, b); }, 0);
    html += view('jpt', '📊 ข้อมูล จปฐ. สงขลา', (fyJ ? 'ปี ' + fyJ + ' · ' : '') + 'ตัวเลขรวม ไม่มีข้อมูลรายบุคคล · แตะหัวข้อเพื่อดูกราฟ',
      '<div id="jpt-tabs">' + jGroups.map(function (g) {
        return '<div class="jpt-tabs"><span class="jpt-tg">' + esc(g.name) + '</span>' + g.items.join('') + '</div>';
      }).join('') + '</div><div class="card wide" id="jpt-body"></div>');
  }

  /* ---------- เคลียร์โครงการ ---------- */
  function projBlock() {
    if (!P.ready) return '<div class="empty">อยู่ระหว่างรวบรวมข้อมูลโครงการ ปีงบประมาณ ' + P.fy + '</div>';
    var byIssue = {};
    P.items.forEach(function (x) { var k = x.issue || 'อื่น ๆ'; byIssue[k] = (byIssue[k] || 0) + (Number(x.budget) || 0); });
    var issues = Object.keys(byIssue).map(function (k) { return { label: k, value: byIssue[k] }; }).sort(function (a, b) { return b.value - a.value; });
    return HK.ui.kpis([[baht(P.total), 'งบประมาณรวม'], [P.pct + '%', 'เบิกจ่ายแล้ว'], [n0(P.items.length), 'โครงการ']])
      + '<div class="hk-prog"><i style="width:' + Math.min(100, P.pct) + '%"></i></div>'
      + (issues.length > 1 ? HK.ui.panel('งบประมาณตามประเด็น', HK.ui.donut(issues, 'บาท', 250)) : '')
      + '<details class="more"><summary>📋 ดูรายชื่อโครงการทั้งหมด (' + P.items.length + ')</summary>'
      + '<div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>โครงการ</th><th class="n">งบประมาณ</th><th class="n">เบิกจ่าย</th></tr></thead><tbody>'
      + P.items.map(function (x) {
        return '<tr><td>' + esc(x.name) + '<div class="meta">' + esc([x.issue, x.status].filter(Boolean).join(' · ')) + '</div></td><td class="n">'
          + Number(x.budget).toLocaleString('th-TH') + '</td><td class="n">' + x.pct + '%</td></tr>';
      }).join('') + '</tbody></table></div></details>';
  }
  html += view('projects', '🔍 เคลียร์โครงการ', 'งบประมาณปี ' + P.fy + ' ใช้ทำอะไร', '<div id="proj-body"></div>');

  /* ---------- เที่ยวโคก หนอง นา ---------- */
  if (K.length) {
    html += view('knn', '🌾 เที่ยวโคก หนอง นา', '1 อำเภอ 1 ศูนย์เรียนรู้', '<div class="cards">' + K.map(function (t) {
      var extra = [['📍', t.place], ['🍽️', t.menu], ['🎉', t.event], ['🕘', t.open]].filter(function (x) { return x[1]; })
        .map(function (x) { return x[0] + ' ' + esc(x[1]); }).join('\n');
      return '<div class="card"><div class="meta">อ.' + esc(t.district) + '</div><h3>' + esc(t.center) + '</h3>'
        + (t.highlight ? '<p class="lead">🌱 ' + esc(t.highlight) + '</p>' : '')
        + '<div class="btns">' + linkBtn(t.mapUrl, '🗺️ แผนที่') + linkBtn(t.clipUrl, '🎬 ดูคลิป', 'alt') + '</div>'
        + (extra ? '<details class="more"><summary>📖 รายละเอียด</summary><p>' + extra + '</p></details>' : '') + '</div>';
    }).join('') + '</div>');
  }

  /* ---------- ติดต่ออำเภอ: ปุ่มโทรใหญ่ ---------- */
  html += view('districts', '📍 ติดต่อ พช.อำเภอ', 'แตะ "โทร" เพื่อโทรหาสำนักงานพัฒนาชุมชนอำเภอ', '<div class="dist-grid">' + D.districts.map(function (d) {
    var tel = String(d.phone || '').split(/[,/]/)[0].replace(/\D/g, '');
    var info = [d.address, d.phone ? '📞 ' + d.phone : '', d.email ? '✉️ ' + d.email : ''].filter(Boolean).join('\n');
    return '<div class="card"><h3>อำเภอ' + esc(d.name) + '</h3><div class="btns" style="margin-top:6px">' + (tel ? linkBtn('tel:' + tel, '📞 โทร') : '') + linkBtn(d.web, '🌐 เว็บไซต์', 'alt') + '</div>'
      + (info ? '<details class="more"><summary>🏢 ที่อยู่</summary><p>' + esc(info) + '</p></details>' : '') + '</div>';
  }).join('') + '</div>');

  /* ---------- ถาม / ร้องเรียน ---------- */
  html += view('help', '💬 ถาม / ร้องเรียน', 'แตะคำถามเพื่อดูคำตอบ',
    D.faq.map(function (f) { return acc(f, { emoji: '❓' }); }).join('')
    + '<h2 style="font-size:1.2rem;margin-top:18px">📢 ช่องทางร้องเรียน</h2>' + D.channels.map(function (c) { return acc(c, { emoji: '📢', color: '#D97706' }); }).join('')
    + '<div class="quick">' + linkBtn('tel:' + TEL, '📞 โทรสำนักงาน', '') + (D.lineUrl ? linkBtn(D.lineUrl, '💚 ถามฮูกใน LINE', 'green') : '') + '</div>');

  /* ---------- กิจกรรม ---------- */
  html += view('activities', '📸 กิจกรรม', 'ภาพกิจกรรมล่าสุด', D.activities.length
    ? '<div class="cards">' + D.activities.map(function (a) {
      return '<div class="card">' + (a.image ? '<img src="' + esc(a.image) + '" alt="">' : '') + '<h3>' + esc(a.title) + '</h3><div class="meta">' + esc(a.date)
        + (a.district ? ' · อ.' + esc(a.district) : '') + '</div><p class="clamp">' + esc(a.summary) + '</p>' + (a.link ? '<div class="btns">' + linkBtn(a.link, '📰 อ่านข่าว') + '</div>' : '') + '</div>';
    }).join('') + '</div>'
    : '<div class="empty">ติดตามภาพกิจกรรมได้ที่ Facebook ของสำนักงาน</div><div class="btns">' + linkBtn('https://www.facebook.com/cddsongkhla', '📘 เปิด Facebook สพจ.สงขลา') + '</div>');

  /* ---------- เกี่ยวกับเรา / ใสสะอาด ---------- */
  html += view('about', '🦉 เกี่ยวกับเรา', 'สำนักงานพัฒนาชุมชนจังหวัดสงขลา',
    (D.about.length ? D.about.map(function (x, i) { return acc(x, { open: i === 0 }); }).join('') : '<div class="empty">อยู่ระหว่างรวบรวมข้อมูล</div>')
    + (D.stats.length ? '<h2 style="font-size:1.2rem;margin-top:18px">ตัวเลขสำคัญ</h2>' + D.stats.map(function (x) { return acc(x, {}); }).join('') : ''));
  html += view('integrity', '✨ พช.ใสสะอาด', 'ความโปร่งใส ตรวจสอบได้',
    D.integrity.length ? D.integrity.map(function (x) { return acc(x, { color: '#0F766E' }); }).join('') : '<div class="empty">อยู่ระหว่างรวบรวมข้อมูล</div>');

  $('#main').innerHTML = html;
  $('#foot').innerHTML = 'ข้อมูล ณ ' + esc(D.updated) + ' · ไม่เก็บข้อมูลส่วนบุคคลของผู้ใช้ · <a href="https://sites.google.com/view/pdpacdd">นโยบายคุ้มครองข้อมูลส่วนบุคคล</a>';
  $('#bar').innerHTML = '<button type="button" data-go="home"><span class="i">🏠</span>หน้าแรก</button>'
    + '<button type="button" data-go="services"><span class="i">🧭</span>บริการ</button>'
    + '<a href="tel:' + TEL + '"><span class="i">📞</span>โทร</a>'
    + (D.lineUrl ? '<a class="line" href="' + esc(D.lineUrl) + '"><span class="i">💚</span>LINE</a>' : '<button type="button" data-go="help"><span class="i">💬</span>ถาม</button>');

  /* ---------- บริการ: แสดงรายการของหมวด ---------- */
  var curGrp = '';
  function showGroup(key) {
    var g = groups.find(function (x) { return x.key === key; }) || groups[0];
    if (!g) { $('#svc-list').innerHTML = '<div class="empty">อยู่ระหว่างรวบรวมข้อมูล</div>'; return; }
    curGrp = g.key;
    Array.prototype.forEach.call(document.querySelectorAll('[data-grp]'), function (b) { b.classList.toggle('on', b.getAttribute('data-grp') === g.key); });
    $('#svc-list').innerHTML = '<h2 style="font-size:1.2rem">' + g.emoji + ' ' + esc(g.name) + '</h2>'
      + D.services.filter(function (s) { return s.group === g.key; }).map(function (s) { return acc(s, { color: g.color, contact: true }); }).join('');
  }

  /* ---------- กราฟ (วาดเมื่อหน้านั้นแสดง — กราฟในหน้าที่ซ่อนจะมีขนาด 0) ---------- */
  var jptIdx = 0;
  function drawJpt() {
    var body = $('#jpt-body');
    if (!J.length || !body || !$('#v-jpt').classList.contains('on')) return;
    HK.destroyIn(body);
    body.innerHTML = '<h3>' + esc(J[jptIdx].title) + '</h3>' + HK.jptBlock(J[jptIdx].detail);
    HK.mount();
  }
  function drawProj() {
    var pb = $('#proj-body');
    if (!pb || !$('#v-projects').classList.contains('on')) return;
    HK.destroyIn(pb);
    pb.innerHTML = projBlock();
    HK.mount();
  }

  /* ---------- เปลี่ยนหน้า (รองรับลิงก์ #services #svc-data #knn จาก LINE และปุ่มย้อนกลับ) ---------- */
  var gs = window.google && google.script && google.script.history ? google.script : null;
  var cur = '';
  function route(hash, push) {
    hash = String(hash || '').replace(/^#/, '');
    var grp = /^svc-(.+)$/.exec(hash);
    var id = grp ? 'services' : hash;
    if (!document.getElementById('v-' + id)) id = 'home';
    Array.prototype.forEach.call(document.querySelectorAll('.view'), function (v) { v.classList.toggle('on', v.id === 'v-' + id); });
    Array.prototype.forEach.call(document.querySelectorAll('#bar [data-go]'), function (b) { b.classList.toggle('on', b.getAttribute('data-go') === id); });
    if (id === 'services') showGroup(grp ? grp[1] : curGrp);
    if (id === 'jpt') drawJpt();
    if (id === 'projects') drawProj();
    if (cur !== id) window.scrollTo(0, 0);
    cur = id;
    if (push) {
      var h = id === 'home' ? '' : (id === 'services' && curGrp ? 'svc-' + curGrp : id);
      try { if (gs) gs.history.push(null, null, h); else if (location.hash.replace('#', '') !== h) history.pushState(null, '', h ? '#' + h : location.pathname + location.search); } catch (e) { /* ไม่สำคัญ */ }
    }
  }
  document.addEventListener('click', function (e) {
    var g = e.target.closest('[data-go]');
    if (g) { e.preventDefault(); route(g.getAttribute('data-go'), true); return; }
    var k = e.target.closest('[data-grp]');
    if (k) { showGroup(k.getAttribute('data-grp')); route('svc-' + k.getAttribute('data-grp'), true); $('#svc-list').scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    var j = e.target.closest('#jpt-tabs button');
    if (j) {
      jptIdx = Number(j.getAttribute('data-i'));
      Array.prototype.forEach.call(document.querySelectorAll('#jpt-tabs button'), function (x) { x.classList.toggle('on', x === j); });
      drawJpt();
    }
  });
  if (gs) {
    gs.history.setChangeHandler(function (ev) { route(ev.location && ev.location.hash, false); });
    try { gs.url.getLocation(function (loc) { route(loc.hash, false); }); } catch (e) { route('', false); }
  } else {
    window.addEventListener('popstate', function () { route(location.hash, false); });
    route(location.hash, false);
  }

  /* ---------- ขนาดตัวอักษร (3 ระดับ จำไว้ในเครื่อง) + โหมดมืด ---------- */
  function setFs(d) {
    var v = Math.max(0, Math.min(2, (Number(document.documentElement.getAttribute('data-fs')) || 0) + d));
    if (v) document.documentElement.setAttribute('data-fs', String(v)); else document.documentElement.removeAttribute('data-fs');
    try { localStorage.setItem('hk-fs', v ? String(v) : ''); } catch (e) { /* ไม่เป็นไร */ }
    drawJpt(); drawProj();
  }
  $('#fs-up').addEventListener('click', function () { setFs(1); });
  $('#fs-down').addEventListener('click', function () { setFs(-1); });
  HK.themeButton($('#theme-btn'), function () { drawJpt(); drawProj(); HK.mount(); });
}
(function () {
  // GitHub Pages: โหลดข้อมูลจาก Apps Script · แสดงข้อมูลที่จำไว้ (ไม่เกิน 6 ชั่วโมง) ทันที แล้วอัปเดตไว้ใช้ครั้งถัดไป
  var API = 'https://script.google.com/macros/s/AKfycbzSwHMndhctRNFIr2gIrahEvCgMmBDvjIj7WvEqvFOWBtFrwcc-BQ1SUk79wgc0MRGC/exec';
  var box = document.getElementById('main');
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem('hk-pub') || 'null'); } catch (e) { cached = null; }
  var fresh = cached && cached.at && Date.now() - cached.at < 6 * 3600000 ? cached.data : null;
  if (fresh) main(fresh); else box.innerHTML = '<div class="empty" style="margin-top:30px;font-size:1.1rem">⏳ กำลังโหลดข้อมูล…</div>';
  fetch(API + '?api=public', { redirect: 'follow' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      try { localStorage.setItem('hk-pub', JSON.stringify({ at: Date.now(), data: d })); } catch (e) { /* เต็ม/ปิดไว้ */ }
      if (!fresh) main(d);
    })
    .catch(function () {
      if (!fresh) box.innerHTML = '<div class="empty" style="margin-top:30px">โหลดข้อมูลไม่สำเร็จ ลองใหม่อีกครั้ง<br><br><a class="btn" href="' + API + '?app=public">เปิดหน้าเว็บสำรอง</a></div>';
    });
})();
</script>
